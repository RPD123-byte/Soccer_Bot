
---
- name: Mock Ansible Playbook
  hosts: all
  become: yes # Added become for potential privilege escalation needs

  vars:
    package_name: httpd # Example variable

  tasks:
    - name: Ensure {{ package_name }} is installed
      ansible.builtin.package:
        name: "{{ package_name }}"
        state: present

    - name: Ensure service is started and enabled
      ansible.builtin.service:
        name: "{{ package_name }}"
        state: started
        enabled: yes
